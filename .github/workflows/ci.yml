name: CI

# The blocking PR gate. TWO jobs, run in parallel, that together prove the repo
# is healthy along every axis — build, lint, types, tests, structural/perf
# invariants — and are dialect-AGNOSTIC by construction: per-dialect correctness
# is not a separate "Less readiness" headline, it lives in each parser's own
# suite, all of which run across the two jobs here:
#
#   verify       — full clean build + lint + strict types + the jess ratchet
#                  (the CLI app's corpus/plugin suite, which needs BUILT artifacts)
#                  + every structural/perf gate. Add THIS to branch protection.
#   test-source  — the build-free opt-out test suite (`pnpm -r --filter='!jess'
#                  test`), primed by a ~3s core/fns/parser-shared build instead of
#                  the full 22-package chain. Runs concurrently with `verify` so
#                  the ~90s test payload leaves the critical path. Add it too.
#
# Why the split is safe: vitest source-aliases every `@jesscss/*` to `src` (see
# vitest.config.ts), so the only BUILT artifacts a source test needs are (1) the
# parser-shared macro-fusion pieces parseman's plugin reads at transform, and (2)
# the handful of core/fns lib subpaths (`core/ast`, `fns/sass/*`) that are not
# source-aliased — all produced by the cheap prime. The four parser `/positions`
# and `compiler/diagnostics` subpaths are source-aliased in vitest.config so no
# parser build is needed. `jess` is the sole genuinely build-bound suite and
# stays in `verify`.
#
# Per-dialect suites, all still gated:
#
#   css   — css-parser suite incl. render-differential.test.ts
#   scss  — scss-parser suite incl. the sass-spec cache (2404 cases)
#   less  — less-parser suite + the full @less/test-data corpus (via the jess
#           ratchet below, which checks out and renders the real-world corpus)
#   jess  — jess-parser suite + the jess known-failures ratchet
#
# The job hard-fails and is green on a clean `dev` — a gate that is red on an
# untouched checkout teaches people to reach for `--no-verify`, and then it is
# not a gate. Known debt is NAMED, not hidden: packages/jess/test/known-failures.json
# lists each expected failure and scripts/vitest-ratchet.mjs fails on a new failure
# AND on a listed test that starts passing, so the set only moves deliberately.
#
# NOTE: the standalone byte-identity oracles (oracle:less:byte-identity,
# oracle:scss:byte-identity) are deliberately NOT gated here. They are snapshot
# drift-detectors whose committed baselines require manual rebaseline as the
# parsers evolve; run them by hand during focused parser work.
#
# Add this job to branch protection as a required check — a workflow can make
# itself fail but cannot make itself required.

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build · lint · types · tests · gates
    runs-on: ubuntu-latest
    # Corpus-backed jess tests (test/less/*.test.ts via resolveLessTestDataRoot)
    # run inside the package test suites. They resolve the @less/test-data corpus,
    # a sibling `link:../less.js/packages/test-data` checkout absent in CI; without
    # it those files fail to load and their cases fail. Point every step at the
    # corpus we check out below.
    env:
      LESS_TEST_DATA_ROOT: ${{ github.workspace }}/less-corpus/packages/test-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Less.js corpus (matthew-dean/less.js@alpha)
        uses: actions/checkout@v4
        with:
          repository: matthew-dean/less.js
          ref: alpha
          path: less-corpus

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean build every run: delete every workspace lib then rebuild. Incremental
      # builds mask errors (a stale lib once masked a grammar compose failure).
      # GRAPH-PARALLEL: pnpm -r honours the workspace dependency graph, so the
      # parser spine (css → less/scss → jess) and core still build in order while
      # independent leaves build concurrently — measured ~1m vs ~4m40s for the old
      # --workspace-concurrency=1, and the compose-integrity / fallback / macro gates
      # all parse the interleaved build.log correctly. Output is captured so the
      # compose-integrity step can grep it without rebuilding.
      - name: Clean lib output
        run: node scripts/clean-package-libs.mjs

      - name: Clean graph-parallel build
        run: |
          set -o pipefail
          pnpm -r \
            --filter='!jess-docs' \
            --filter='!@jesscss/docs-less' \
            --filter='!@jesscss/docs-content' \
            build 2>&1 | tee build.log

      # --- build integrity: the artifact is only trustworthy if nothing silently
      # degraded a grammar to the runtime interpreter (visible only in build output). ---
      - name: Fallback-detector canaries
        run: node --test scripts/__tests__/parseman-fallback-detector.test.mjs

      - name: Compose-integrity check
        run: node scripts/verify-compose-integrity.mjs --log build.log

      - name: Macro-buildability check
        run: node scripts/check-macro-buildable.mjs --no-build

      # Every dialect grammar's reducers must reference only IMPORTED helpers, never
      # a module-scope helper defined in grammar.ts. This is a NECESSARY (not
      # sufficient) condition for cross-package compose() fusion — it is a static
      # per-reducer check and does NOT run the real compose([cssBaseRules, delta]).
      # css/less/scss/jess all sit at 0 after the B0 hoist; this keeps them there
      # (fix an offender by moving the helper into that dialect's grammar-helpers.ts).
      - name: Reducer-purity gate (reducers import their helpers)
        run: node scripts/probe/parseman-compose-reducer-census.mjs --check

      # --- static analysis --- (run explicitly, NOT via `pnpm ci`, which would
      # re-run lint + core-public-types a second time)
      - name: Lint
        run: pnpm run lint

      - name: Strict production types
        run: pnpm run verify:types

      - name: Core public type consumer
        run: pnpm run verify:core-public-types

      - name: Config syntax
        run: pnpm run verify:config-syntax

      - name: Cross-tool surface parity
        run: pnpm run verify:surface-parity

      # --- tests: the build-free opt-out suite (`pnpm -r --filter='!jess' test`)
      # runs in the PARALLEL `test-source` job below, not here — it needs only a
      # ~3s core/fns/parser-shared prime, so pinning it behind this job's full
      # build wasted its whole runtime on the critical path. `jess` stays here:
      # it is the CLI app whose known-failures ratchet loads plugins and renders
      # the real @less/test-data corpus from BUILT artifacts, so it is genuinely
      # build-bound. Its full suite — public-API contract, path resolution,
      # AST-v2 ratchet, CLI — runs inside test:ratchet.
      - name: Jess suite (known-failures ratchet)
        run: pnpm --filter jess run test:ratchet

      # --- public surface + release-shape checks (were bundled under the
      # misnamed verify:less-alpha; none of these are Less-specific) ---
      - name: Package exports
        run: pnpm run verify:package-exports

      - name: Jess public API surface
        run: pnpm run verify:jess-api

      # verify:baseline itself is a LOCAL pre-push meta-gate that rebuilds the
      # runtime chain and re-runs core/parser tests + the frontier checks — all
      # already covered above by the one clean build, `-r test`, and the explicit
      # frontier gates below. Its only non-redundant check that is green on a
      # clean tree is this one (verify:parser-runtime-boundary is NOT — it reports
      # pre-existing handwritten-recognizer debt in the parser grammars, so it
      # stays a report/local check, not a blocking gate, until that debt is paid):
      - name: Node constructor metadata
        run: pnpm run verify:node-constructor-metadata

      # --- perf / structural invariants (were wired only into release:alpha:check) ---
      - name: Gate — aggressive cutting review
        run: pnpm run verify:aggressive-cutting-review

      - name: Gate — node-copy frontier
        run: pnpm run verify:node-copy-frontier

      - name: Gate — materialization frontier
        run: pnpm run verify:materialization-frontier

      - name: Gate — render-buffer frontier
        run: pnpm run verify:render-buffer-frontier

      - name: Gate — binding lookup hot paths
        run: pnpm run verify:binding-lookup-hot-paths

      - name: Gate — diagnostic cold path
        run: pnpm run verify:diagnostic-cold-path

      - name: Audit — node creation hotspots
        run: pnpm run audit:node-creation

  # Build-free source tests, run IN PARALLEL with `verify`. vitest source-aliases
  # every `@jesscss/*` to `src`, so this suite does not need the full build — only
  # a cheap prime:
  #
  #   * `@jesscss/parser-shared` — its COMPILED lib carries the macro-fused grammar
  #     recognition pieces (cssSyntax / opaque-at-rule / pseudo-consts) that
  #     parseman's plugin reads at transform when it fuses each grammar's
  #     `composeLeaf(...)`. Without this lib the transform cannot fuse and the four
  #     grammars fail at runtime with `composeLeaf() must macro-fuse`. This is the
  #     one artifact the vite src-aliases cannot substitute (the plugin resolves it
  #     itself, compiled-only, ignoring vite aliases).
  #   * `@jesscss/core` + `@jesscss/fns` — the `core/ast` and `fns/sass/*` lib
  #     subpaths the parsers import at runtime are not source-aliased, so their
  #     built libs must exist. Both are fast tsdown bundles; the whole prime is ~3s.
  #
  # `pnpm --filter '@jesscss/core...' --filter '@jesscss/fns...'` pulls their shared
  # `awaitable-pipe` dep in too. NO parser, jess, editor, or docs build runs here.
  test-source:
    name: Source tests (build-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap prime: build ONLY the libs a source test consumes (see block above).
      - name: Prime — build parser-shared + core + fns
        run: pnpm --filter '@jesscss/parser-shared' --filter '@jesscss/core...' --filter '@jesscss/fns...' build

      # Opt-out coverage: `-r test` runs EVERY workspace package by default, so a
      # newly added package is gated the moment it exists. `jess` is excluded — it
      # is build-bound and runs via its ratchet in `verify`.
      - name: All source-runnable package tests (opt-out; jess runs in verify)
        run: pnpm -r --filter='!jess' test
