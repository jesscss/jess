name: CI

# The blocking PR gate. FOUR jobs, run in parallel, that together prove the repo
# is healthy along every axis — build, lint, types, tests, structural/perf
# invariants, owner rulings — and are dialect-AGNOSTIC by construction:
# per-dialect correctness is not a separate "Less readiness" headline, it lives
# in each parser's own suite, all of which run across the jobs here:
#
#   owner-rulings — `pnpm check:guardrails` (no install, seconds). Add it too.
#   verify       — full clean build + lint + strict types + the jess ratchet
#                  (the CLI app's corpus/plugin suite, which needs BUILT artifacts)
#                  + every structural/perf gate. Add THIS to branch protection.
#   grammar-speed — per-grammar parse cost in instructions (Valgrind), against
#                  a committed baseline. Its own job so its counting stays off
#                  the critical path. Add it too.
#   test-source  — the build-free opt-out test suite (`pnpm -r --filter='!jess'
#                  test`), primed by a ~3s core/fns/parser-shared build instead of
#                  the full 22-package chain. Runs concurrently with `verify` so
#                  the ~90s test payload leaves the critical path. Add it too.
#
# Why the split is safe: vitest source-aliases every `@jesscss/*` export, bare
# name and subpath, to `src` (scripts/workspace-src-aliases.mjs), so the only
# BUILT artifacts a source test needs are the ones loaded outside vite: (1) the
# parser-shared macro-fusion pieces parseman's plugin reads at transform, and (2)
# the core/fns libs that native loaders reach — a dialect plugin's provided
# modules (`#less`, `sass:*`), for one, load through the plugin's own `require`
# — all produced by the cheap prime. No parser
# build is needed. `jess` is the sole genuinely build-bound suite and stays in
# `verify`.
#
# Per-dialect suites, all still gated:
#
#   css   — css-parser suite incl. render-differential.test.ts
#   scss  — scss-parser suite incl. the sass-spec cache (2404 cases)
#   less  — less-parser suite + the full @less/test-data corpus (via the jess
#           ratchet below, which checks out and renders the real-world corpus)
#   jess  — jess-parser suite + the jess known-failures ratchet
#
# The job hard-fails and is green on a clean `dev` — a gate that is red on an
# untouched checkout teaches people to reach for `--no-verify`, and then it is
# not a gate. Known debt is NAMED, not hidden: packages/jess/test/known-failures.json
# lists each expected failure and scripts/vitest-ratchet.mjs fails on a new failure
# AND on a listed test that starts passing, so the set only moves deliberately.
#
# NOTE: the standalone byte-identity oracles (oracle:less:byte-identity,
# oracle:scss:byte-identity) are deliberately NOT gated here. They are snapshot
# drift-detectors whose committed baselines require manual rebaseline as the
# parsers evolve; run them by hand during focused parser work.
#
# Add this job to branch protection as a required check — a workflow can make
# itself fail but cannot make itself required.

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Owner rulings are not reversible by an agent: `pnpm check:guardrails` fails
  # on an edited owner requirement, an unattributed closure, Less 4.x / lessc
  # behaviour offered as a reason, or an owner-ruled ledger row / conformance
  # test changed without docs/architecture/core/owner-rulings.lock.json. Node
  # built-ins only, so no install: it reports in seconds. The conformance tests
  # and the executed migration-guide examples run in `verify` (they need the
  # build). Add THIS job to branch protection too.
  owner-rulings:
    name: Owner rulings · guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: pnpm check:guardrails
        run: node scripts/check-guardrails.mjs

  verify:
    name: Build · lint · types · tests · gates
    runs-on: ubuntu-latest
    # Corpus-backed jess tests (test/less/*.test.ts via resolveLessTestDataRoot)
    # run inside the package test suites. They resolve the @less/test-data corpus,
    # a sibling `link:../less.js/packages/test-data` checkout absent in CI; without
    # it those files fail to load and their cases fail. Point every step at the
    # corpus we check out below.
    env:
      LESS_TEST_DATA_ROOT: ${{ github.workspace }}/less-corpus/packages/test-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Also run inside this already-required check, so the owner-ruling gate
      # blocks a merge even before `owner-rulings` is added to branch protection.
      - name: Owner rulings — pnpm check:guardrails
        run: node scripts/check-guardrails.mjs

      - name: Checkout Less.js corpus (matthew-dean/less.js@alpha)
        uses: actions/checkout@v4
        with:
          repository: matthew-dean/less.js
          ref: alpha
          path: less-corpus

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The structure assertion (6) parses TypeScript, so the no-install runs
      # above skip it. Here the parser is installed, and a skip would fail.
      - name: Guardrails — structure only shrinks
        run: node scripts/check-guardrails.mjs --require-structure

      # Clean build every run: delete every workspace lib then rebuild. Incremental
      # builds mask errors (a stale lib once masked a grammar compose failure).
      # GRAPH-PARALLEL: pnpm -r honours the workspace dependency graph, so the
      # parser spine (css → less/scss → jess) and core still build in order while
      # independent leaves build concurrently — measured ~1m vs ~4m40s for the old
      # --workspace-concurrency=1, and the compose-integrity / fallback / macro gates
      # all parse the interleaved build.log correctly. Output is captured so the
      # compose-integrity step can grep it without rebuilding.
      - name: Clean lib output
        run: node scripts/clean-package-libs.mjs

      - name: Clean graph-parallel build
        run: |
          set -o pipefail
          pnpm -r \
            --filter='!jess-docs' \
            --filter='!@jesscss/docs-less' \
            --filter='!@jesscss/docs-content' \
            build 2>&1 | tee build.log

      # --- build integrity: the artifact is only trustworthy if nothing silently
      # degraded a grammar to the runtime interpreter (visible only in build output). ---
      - name: Fallback-detector canaries
        run: node --test scripts/__tests__/parseman-fallback-detector.test.mjs

      - name: Compose-integrity check
        run: node scripts/verify-compose-integrity.mjs --log build.log

      - name: Macro-buildability check
        run: node scripts/check-macro-buildable.mjs --no-build

      # check:macro only proves nothing fell back to the interpreter. A table
      # with no precompiled assembly is "fully compiled" and still slow: that is
      # how Less, SCSS and .jess lost their fast path on 2026-08-31 with every
      # gate green (jesscss/jess#508). This gate counts each grammar artifact's
      # precompiled assembly and bytes per source byte (parseman's 5x budget)
      # against scripts/grammar-artifacts.baseline.json; growth, lost assembly
      # and unnamed debt fail. The canaries show each failure class going red,
      # starting with the real css ast.js stripped to `a: []`.
      - name: Grammar gate canaries
        run: node --test scripts/__tests__/grammar-gates.test.mjs

      - name: Gate — grammar artifact size + precompiled assembly
        run: node scripts/check-grammar-artifacts.mjs

      # A dialect composes onto css's compose base from the matching build:
      # compiled over compiled, interpreter over interpreter, and never through
      # css's own parse grammar.
      - name: Grammar variant import graphs
        run: node --test scripts/__tests__/grammar-variant-graph.test.mjs

      # docs/grammar/railroad is regenerated by hand from the source grammars.
      # Keep the generator able to build all four (it fails if one cannot be
      # loaded or has no Stylesheet production) so the pages can always be
      # regenerated. Writes to a temp dir; the committed pages are not compared.
      - name: Railroad diagram generator
        run: node scripts/generate-railroad-diagrams.mjs --out "$RUNNER_TEMP/railroad"

      # Node engines must stay at the canonical require(esm) range; blocks silent
      # drift like the 22.12 -> 22.18 floor bump that broke engine-strict installs.
      - name: Node-engines guard
        run: node scripts/check-node-engines.mjs

      # The release gates (packed-consumer import scan, alpha source-sync,
      # version resolution) run only at release time; test their logic here.
      - name: Release script tests
        run: pnpm run test:release --run

      # Every dialect grammar's reducers must reference only IMPORTED helpers, never
      # a module-scope helper defined in grammar.ts. This is a NECESSARY (not
      # sufficient) condition for cross-package compose() fusion — it is a static
      # per-reducer check and does NOT run the real compose([cssBaseRules, delta]).
      # css/less/scss/jess all sit at 0 after the B0 hoist; this keeps them there
      # (fix an offender by moving the helper into that dialect's grammar-helpers.ts).
      - name: Reducer-purity gate (reducers import their helpers)
        run: node scripts/probe/parseman-compose-reducer-census.mjs --check

      # Build-then-LOAD complement to the static census: the four Less, four
      # SCSS AND four Jess variants actually compose on cssBaseRules (W0), and
      # every CSS variant is a table. Fails if a variant (ESM or CommonJS) left a
      # runtime compose( in its emitted table (did not fuse), reads
      # @jesscss/parser-shared as grammar (recognition not fused), or throws when
      # its compiled table is first materialized by a real parse.
      # Runs against the lib/ the build above produced.
      - name: Compose fused + load gate (CSS + Less + SCSS + Jess)
        run: node scripts/probe/compose-fused-check.mjs

      # --- static analysis --- (run explicitly, NOT via `pnpm ci`, which would
      # re-run lint + core-public-types a second time)
      - name: Lint
        run: pnpm run lint

      - name: Strict production types
        run: pnpm run verify:types

      - name: Core public type consumer
        run: pnpm run verify:core-public-types

      - name: Config syntax
        run: pnpm run verify:config-syntax

      - name: Cross-tool surface parity
        run: pnpm run verify:surface-parity

      # The public site deploys from every dev merge. Build the exact production
      # facing in this required job so a broken docs change cannot reach dev and
      # leave the public site pinned to the preceding revision.
      - name: Canonical docs content
        run: pnpm run docs:content:validate

      - name: Jess docs production build
        run: pnpm run docs:jess:build

      # --- tests: the build-free opt-out suite (`pnpm -r --filter='!jess' test`)
      # runs in the PARALLEL `test-source` job below, not here — it needs only a
      # ~3s core/fns/parser-shared prime, so pinning it behind this job's full
      # build wasted its whole runtime on the critical path. `jess` stays here:
      # it is the CLI app whose known-failures ratchet loads plugins and renders
      # the real @less/test-data corpus from BUILT artifacts, so it is genuinely
      # build-bound. Its full suite — public-API contract, path resolution,
      # AST-v2 ratchet, CLI — runs inside test:ratchet.
      # Named on its own so a reversed owner ruling is visible in the check list:
      # the owner-ruling conformance tests (it.fails entries pass while the code
      # still contradicts the ruling) and every marked example of the two Less
      # 4 -> 5 migration guides, compiled and compared with the documented output.
      # Explicit file paths: a vitest run that matches no file exits 1.
      - name: Owner rulings — conformance tests + migration-guide examples
        run: pnpm --filter jess exec cross-env TEST=true vitest run test/owner-rulings.test.ts test/migration-docs.test.ts

      - name: Jess suite (known-failures ratchet)
        run: pnpm --filter jess run test:ratchet

      # --- public surface + release-shape checks (were bundled under the
      # misnamed verify:less-alpha; none of these are Less-specific) ---
      - name: Package exports
        run: pnpm run verify:package-exports

      - name: Jess public API surface
        run: pnpm run verify:jess-api

      # --- perf / structural invariants (were wired only into release:alpha:check) ---
      - name: Gate — aggressive cutting review
        run: pnpm run verify:aggressive-cutting-review

      - name: Gate — node-copy frontier
        run: pnpm run verify:node-copy-frontier

      - name: Gate — materialization frontier
        run: pnpm run verify:materialization-frontier

      - name: Gate — diagnostic cold path
        run: pnpm run verify:diagnostic-cold-path

      - name: Gate — hot-path antipattern rules (unit tests)
        run: pnpm run test:hot-path-rules

      - name: Gate — hot-path antipattern inventory (shrink-only)
        run: pnpm run verify:hot-path

      # The four parsers recognize source only through Parseman grammar: a
      # handwritten scan of source text in a parser package fails here. Its debt
      # ledger (scripts/parser-runtime-boundary-debt.json) is empty, so a new
      # site fails the PR instead of first surfacing in the release preflight.
      - name: Gate — parser runtime boundary
        run: pnpm run verify:parser-runtime-boundary

  # Capability contracts (COD, `capabilities/*/capability.json`): every
  # contract's review must be current, and its native checker must pass the real
  # owner and consumers while rejecting each declared copy and unused-owner
  # decoy (`pnpm verify:capabilities`, the pinned toolkit in scripts/cod.mjs).
  # Its own job, in parallel with `verify`; the toolkit's engines stop at Node
  # 24. Add it to branch protection too.
  capabilities:
    name: Capability contracts · cod verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LESS_TEST_DATA_ROOT: ${{ github.workspace }}/less-corpus/packages/test-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Less.js corpus (matthew-dean/less.js@alpha)
        uses: actions/checkout@v4
        with:
          repository: matthew-dean/less.js
          ref: alpha
          path: less-corpus

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --filter='!jess-docs' --filter='!@jesscss/docs-less' --filter='!@jesscss/docs-content' build

      - name: pnpm verify:capabilities
        run: pnpm run verify:capabilities

  # Per-grammar parse cost: marginal instructions per AST parse, counted by
  # Valgrind (GitHub-hosted runners expose no hardware instruction counter),
  # against scripts/grammar-speed.baseline.json. Its own job, in parallel with
  # `verify`, so its 2-4 minutes of counting stay off the critical path. It
  # builds only the four parsers and what they depend on. Instruction counts
  # depend on the OS image, the Valgrind build and the Node version, so the job
  # pins the image and Node and the baseline records all three; changing any of
  # them re-records the baseline (`--propose`, on CI) in the same reviewed
  # change. Add it to branch protection too.
  grammar-speed:
    name: Grammar speed (instructions per parse)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js (pinned for the instruction baseline)
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the four parsers
        run: pnpm -r --filter '@jesscss/css-parser...' --filter '@jesscss/less-parser...' --filter '@jesscss/scss-parser...' --filter '@jesscss/jess-parser...' build

      - name: Install Valgrind
        run: sudo apt-get install -y -qq valgrind > /dev/null && valgrind --version

      - name: Gate — grammar speed (marginal instructions per parse)
        run: node scripts/grammar-speed-gate.mjs --require-env

  # Build-free source tests, run IN PARALLEL with `verify`. vitest source-aliases
  # every `@jesscss/*` to `src`, so this suite does not need the full build — only
  # a cheap prime:
  #
  #   * `@jesscss/parser-shared` — its COMPILED lib carries the macro-fused grammar
  #     recognition pieces (recognition / unknown-at-rule / pseudo-consts) that
  #     parseman's plugin reads at transform when it fuses each grammar's
  #     `composeLeaf(...)`. Without this lib the transform cannot fuse and the four
  #     grammars fail at runtime with `composeLeaf() must macro-fuse`. This is the
  #     one artifact the vite src-aliases cannot substitute (the plugin resolves it
  #     itself, compiled-only, ignoring vite aliases).
  #   * `@jesscss/core` + `@jesscss/fns` — for the libs native loaders reach,
  #     which no vite alias can redirect: a dialect plugin's provided modules
  #     (`#less`, `sass:*`), for one, load `@jesscss/fns` lib (and that lib's own
  #     `@jesscss/core`) through the plugin's `require`. Both are fast tsdown
  #     bundles; the whole prime is ~3s.
  #
  # `pnpm --filter '@jesscss/core...' --filter '@jesscss/fns...'` pulls their shared
  # `awaitable-pipe` dep in too. The parser libs are built only for the
  # interpreter parity tests (see that step). NO jess, editor, or docs build runs here.
  test-source:
    name: Source tests (build-free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Cheap prime: build ONLY the libs a source test consumes (see block above).
      # css-parser is a compiled-only base here (like parser-shared): a cross-package
      # `compose([cssBaseRules, …])` grammar fuses from the base's built-lib
      # `composedPieces` provenance, not source, so the base lib must exist. The
      # less/scss/jess W-phase compose flips all rely on this same prime.
      - name: Prime — build parser-shared + css-parser + core + fns
        run: pnpm --filter '@jesscss/parser-shared' --filter '@jesscss/css-parser' --filter '@jesscss/core...' --filter '@jesscss/fns...' build

      # Each parser's `interpreter-parity.test.ts` compares its two SHIPPED bundles
      # (`lib/grammar/*` vs `lib/grammar/interpreter/*`), so the remaining three
      # parser libs must exist too. Serial: concurrent parser builds race.
      - name: Prime — build less/scss/jess parsers (interpreter parity tests)
        run: pnpm --workspace-concurrency=1 --filter '@jesscss/less-parser' --filter '@jesscss/scss-parser' --filter '@jesscss/jess-parser' run compile

      # Opt-out coverage: `-r test` runs EVERY workspace package by default, so a
      # newly added package is gated the moment it exists. `jess` is excluded — it
      # is build-bound and runs via its ratchet in `verify`.
      - name: All source-runnable package tests (opt-out; jess runs in verify)
        run: pnpm -r --filter='!jess' test
