name: Less alpha readiness

on:
  pull_request:
  push:
    branches:
      - main
      - alpha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jess-node-support:
    name: Jess CLI on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One leg per SUPPORTED LTS line, spelled as aliases so the window follows
      # Node instead of going stale: when a new line goes LTS these shift on their
      # own. The supported set is three lines — see `engines` in every published
      # package.json (`^20.19.0 || >=22.12.0`).
      #
      # `lts/-3` was removed with that floor: it resolves to Node 18, which reached
      # EOL 2025-04-30 and cannot run oxc/vite/vitest — so the leg was testing a
      # line nothing else in the toolchain supports.
      matrix:
        node: [current]
        include:
          - node: lts/*
          - node: lts/-1
          - node: lts/-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public Jess CLI
        run: pnpm --filter jess build && pnpm --filter jess test -- cli.test.ts --run --globals

  less-alpha-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Less alpha readiness
        run: pnpm run verify:less-alpha
