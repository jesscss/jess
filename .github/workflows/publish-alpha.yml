name: Publish alpha packages

on:
  workflow_dispatch:

# contents: write so the successful publish can push its release tag
# (vX.Y.Z-alpha.N). id-token: write is the OIDC grant for npm trusted publishing.
permissions:
  id-token: write
  contents: write

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    # The preflight runs the corpus-backed jess tests (test/less/*.test.ts via
    # resolveLessTestDataRoot). They resolve the @less/test-data corpus from a
    # sibling checkout that is absent in CI; point them at the corpus cloned
    # below. It is cloned OUTSIDE the repo (into RUNNER_TEMP) rather than checked
    # out into the workspace, because the preflight's alpha source-sync gate
    # requires a clean working tree and would flag a corpus dir under it.
    env:
      LESS_TEST_DATA_ROOT: ${{ runner.temp }}/less-corpus/packages/test-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Less.js corpus (matthew-dean/less.js@alpha) outside the repo
        run: |
          git clone --quiet --depth 1 --branch alpha --single-branch \
            https://github.com/matthew-dean/less.js "$RUNNER_TEMP/less-corpus"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Enforce alpha branch release policy
        run: |
          if [ "${{ github.ref_name }}" != "alpha" ]; then
            echo "This workflow publishes alpha packages and must run on branch 'alpha'."
            echo "Current branch: ${{ github.ref_name }}"
            exit 1
          fi

      - name: Preflight alpha checks
        run: pnpm run release:alpha:check

      - name: Publish allowlisted alpha packages
        id: publish
        run: pnpm run release:alpha:publish

      # Record the published version in git so the repo mirrors npm. The alpha
      # branch is a disposable projection of dev, so the durable record is the
      # tag (which also bypasses branch protection, unlike a branch push).
      - name: Record the published version as a git tag
        if: success() && steps.publish.outputs.version != ''
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to record."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Pushed tag $TAG."
          fi
          echo "Tagged \`$TAG\`." >> "$GITHUB_STEP_SUMMARY"
