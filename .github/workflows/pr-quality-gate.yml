name: PR quality gate

# Runs the full LLM-quality enforcement gate SERVER-SIDE so the git hooks can
# stay fast (commits/pushes must not carry heavy build/test work). This is the
# same gate a developer can run locally with `pnpm verify:pr`.
#
# This workflow BLOCKS: every step below hard-fails the job. It is green on a
# clean `dev`, which is the whole point — a gate that is red on an untouched
# checkout teaches people to reach for `--no-verify`, and then it is not a gate.
#
# Known debt is not hidden here, it is NAMED: `packages/jess/test/known-failures.json`
# lists each failing test, and `scripts/vitest-ratchet.mjs` fails on a new failure
# AND on a listed test that starts passing (so the set only moves deliberately).
#
# Add this job to the repository's required checks in branch protection — the
# workflow can only make itself fail, it cannot make itself required.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-quality-gate:
    name: Full build, lint, tests & structural gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean build: delete every workspace package lib then build the FULL chain
      # SERIALLY in topological order (--workspace-concurrency=1). Incremental
      # builds mask errors — a stale lib recently masked a grammar compose
      # failure. Build output is captured so the compose-integrity step can grep
      # it without rebuilding.
      - name: Clean lib output
        run: node scripts/clean-package-libs.mjs

      - name: Clean serial topological build
        run: |
          set -o pipefail
          pnpm -r --workspace-concurrency=1 \
            --filter='!jess-docs' \
            --filter='!@jesscss/docs-less' \
            --filter='!@jesscss/docs-content' \
            build 2>&1 | tee build.log

      # Both gates below share one detector definition
      # (scripts/parseman-fallback-detector.mjs). A detector that has stopped
      # firing is indistinguishable from a clean build — the retired
      # `_rp[N].parse(` marker sat inert here for exactly that reason — so the
      # two-canary test that proves it still catches a REAL parseman fallback
      # runs before the gates that depend on it.
      - name: Fallback-detector canaries
        run: node --test scripts/__tests__/parseman-fallback-detector.test.mjs

      # Compose-integrity: a parseman macro degrade silently downgrades a grammar
      # to the runtime interpreter (only visible in build output). Fail the PR if
      # the captured build log shows any such fallback / missing rule.
      - name: Compose-integrity check
        run: node scripts/verify-compose-integrity.mjs --log build.log

      # Macro-buildability: compose degrade is only half the concern. A single
      # rule can stop lowering to inline JS while the grammar still composes
      # cleanly — visible in the artifact as a surviving parseman COMBINATOR
      # import. Scans the artifacts the step above already built (--no-build: no
      # second rebuild).
      - name: Macro-buildability check
        run: node scripts/check-macro-buildable.mjs --no-build

      - name: Lint (pnpm lint)
        run: pnpm run lint

      # Strict production type check across all 22 tsconfigs. This was red on
      # clean dev for long enough that the type gate stopped meaning anything;
      # it belongs in the blocking set now that it passes.
      - name: Gate — strict production types
        run: pnpm run verify:types

      # pnpm ci = per-package build + test, covering all parser and core suites.
      - name: Full CI (pnpm ci)
        run: pnpm run ci

      # config-syntax used to run in the pre-commit/pre-push hooks, which are now
      # lint-only; its coverage moves here rather than being dropped.
      - name: Gate — config syntax
        run: pnpm run verify:config-syntax

      # The six existing structural / perf gates + node-creation audit that were
      # previously wired only into the manual release:alpha:check.
      - name: Gate — aggressive cutting review
        run: pnpm run verify:aggressive-cutting-review

      - name: Gate — node-copy frontier
        run: pnpm run verify:node-copy-frontier

      - name: Gate — materialization frontier
        run: pnpm run verify:materialization-frontier

      - name: Gate — render-buffer frontier
        run: pnpm run verify:render-buffer-frontier

      - name: Gate — binding lookup hot paths
        run: pnpm run verify:binding-lookup-hot-paths

      - name: Gate — diagnostic cold path
        run: pnpm run verify:diagnostic-cold-path

      - name: Audit — node creation hotspots
        run: pnpm run audit:node-creation

      # Cross-tool surface parity: AGENTS.md (Codex), CLAUDE.md (Claude), and
      # .cursor/rules/* (Cursor) must each reference the same canonical perf-doc
      # set (docs/perf/V8-ARCHITECTURE.md + the enforcement design). This passes
      # on clean dev, so it blocks like everything else rather than reporting.
      - name: Gate — cross-tool surface parity
        run: pnpm run verify:surface-parity
